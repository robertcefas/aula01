<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Média Do Aluno </h1>
        
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" placeholder="Ex: 10">
        

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" placeholder="Ex: 5">

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" placeholder="Ex: 1">
        

        <button id ="gerarBotão">Calcular média</button>

        <div id="resultadoTabuada"></div>
    </div> <script src="script.js"></script>
</body>
