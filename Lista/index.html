<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shockers | Team Manager</title>
    <style>
        /* --- ESTILO (CSS) --- */
        :root {
            --shock-purple: #8119eb;
            --shock-yellow: #f8db1c;
            --dark-bg: #000000;
            --card-bg: #111111;
            --text-white: #ffffff;
            --danger: #ff4d4d;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Container da Logo */
        .logo-header {
            width: 100%;
            max-width: 500px;
            margin: 20px 0 40px 0;
            text-align: center;
        }

        .logo-header img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Painel de Entrada */
        .input-panel {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
            max-width: 900px;
            border: 1px solid #222;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            margin-bottom: 50px;
            justify-content: center;
        }

        input, select {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 14px;
            color: white;
            border-radius: 8px;
            flex: 1;
            min-width: 200px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--shock-purple);
            box-shadow: 0 0 10px rgba(129, 25, 235, 0.4);
        }

        /* Botão Escalar Centralizado */
        .btn-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-escalar {
            background: var(--shock-purple);
            color: white;
            border: none;
            padding: 15px 70px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .btn-escalar:hover {
            background: var(--shock-yellow);
            color: black;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(248, 219, 28, 0.5);
        }

        /* Grid de Jogadores */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .player-card {
            background: linear-gradient(145deg, #1a1a1a, #050505);
            border-left: 6px solid var(--shock-purple);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botão de Remover Card */
        .btn-remove {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: #777;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 10;
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.1);
        }

        /* Infos dentro do Card */
        .card-content {
            position: relative;
            z-index: 2;
        }

        .card-name-shirt {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            display: block;
        }

        .card-name-full {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 12px;
            display: block;
        }

        .card-pos {
            font-size: 0.8rem;
            background: rgba(129, 25, 235, 0.2);
            color: #b185ec;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }

        .card-bg-number {
            font-size: 6rem;
            font-weight: 900;
            color: rgba(248, 219, 28, 0.05); /* Amarelo bem clarinho ao fundo */
            position: absolute;
            right: -10px;
            bottom: -20px;
            line-height: 1;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="logo-header">
        <img src="logo.png" alt="Logo The Shockers">
    </div>

    <div class="input-panel">
        <input type="text" id="iptNome" placeholder="Nome Completo">
        <input type="text" id="iptCamisa" placeholder="Nome na Camisa">
        <select id="iptPos">
            <option value="Goleiro">Goleiro</option>
            <option value="Defesa">Defesa</option>
            <option value="Meio-Campo">Meio-Campo</option>
            <option value="Ataque">Ataque</option>
        </select>
        <input type="number" id="iptNum" placeholder="Nº">
        
        <div class="btn-wrapper">
            <button class="btn-escalar" onclick="adicionar()">Escalar Atleta</button>
        </div>
    </div>

    <div id="gridRoster" class="roster-grid"></div>

    <script>
        /* --- LÓGICA (JS) --- */
        let time = [];

        function atualizarTela() {
            const grid = document.getElementById('gridRoster');
            grid.innerHTML = "";

            time.forEach((atleta, index) => {
                const html = `
                    <div class="player-card">
                        <button class="btn-remove" onclick="remover(${index})">✕</button>
                        <div class="card-content">
                            <span class="card-name-shirt">${atleta.camisa}</span>
                            <span class="card-name-full">${atleta.nome}</span>
                            <span class="card-pos">${atleta.posicao}</span>
                        </div>
                        <div class="card-bg-number">${atleta.numero}</div>
                    </div>
                `;
                grid.innerHTML += html;
            });
        }

        function adicionar() {
            const nome = document.getElementById('iptNome').value;
            const camisa = document.getElementById('iptCamisa').value.toUpperCase();
            const pos = document.getElementById('iptPos').value;
            const num = document.getElementById('iptNum').value;

            if (!nome || !camisa || !num) {
                alert("Preencha todos os campos!");
                return;
            }

            time.push({ nome, camisa, posicao: pos, numero: num });
            atualizarTela();

            // Limpa campos
            document.getElementById('iptNome').value = "";
            document.getElementById('iptCamisa').value = "";
            document.getElementById('iptNum').value = "";
        }

        function remover(index) {
            time.splice(index, 1);
            atualizarTela();
        }
    </script>
</body>
</html>
